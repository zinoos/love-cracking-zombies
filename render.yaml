# Render-Blueprint: ein Web-Dienst, der Client und WebSocket-Server ausliefert.
# Wichtig: nur EINE Instanz. Lobbys und laufende Matches liegen im Speicher -
# eine zweite Instanz haette ihre eigenen Raeume und Spieler wuerden sich nicht
# mehr finden.
services:
  - type: web
    name: love-cracking-zombies
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: npm ci --omit=dev
    startCommand: node server.js
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: FIREBASE_SERVICE_ACCOUNT_JSON
        sync: false
