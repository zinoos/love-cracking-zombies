# Render-Blueprint: ein Web-Dienst, der Client und WebSocket-Server ausliefert.
# Wichtig: nur EINE Instanz. Lobbys und laufende Matches liegen im Speicher -
# eine zweite Instanz haette ihre eigenen Raeume und Spieler wuerden sich nicht
# mehr finden.
services:
  - type: web
    name: nosershooter
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: npm ci --omit=dev
    startCommand: node server.js
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      # Bestenliste liegt lokal - Render speichert Daten im DATA_DIR.
      - key: DATA_DIR
        value: /data
